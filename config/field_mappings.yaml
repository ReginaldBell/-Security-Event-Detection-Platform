windows_security:
  _reject_event_types:
    - "4672"   # Special privileges assigned — not an auth failure event
    - "4634"   # Account logoff — not an auth failure event
  timestamp:
    - TimeCreated
    - timestamp
    - time
    - "@timestamp"
    - ts
  source_ip:
    - IpAddress
    - source_ip
    - ip
    - src_ip
    - WorkstationName   # NTLM fallback: IpAddress is null on NtLmSsp auth path; workstation is only attribution
  username:
    - SubjectUserName
    - TargetUserName
    - username
    - user
  event_type:
    - EventID
    - event_type
    - type
  result:
    - Keywords
    - result
    - status
  reason:
    - FailureReason
    - reason
    - error
  user_agent:
