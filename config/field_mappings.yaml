    - ProcessCommandLine
    - command_line
  location:
    - location
    - country
  source:
    - Channel
    - source
    - provider
  event_id:
    - event_id
    - EventRecordID
  scenario_id:
    - scenario_id
  validation_run_id:
    - validation_run_id

