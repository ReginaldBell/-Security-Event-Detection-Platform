# field_mappings.yaml
# Defines field alias lists and telemetry reject types per log source profile.
#
# _default is the fallback used when no named profile matches the source field.
# Profile names must match the value of the 'source' field in incoming events.
# Alias lists are ordered — first match wins.
#
# Validate with: python -m app.services.mapping_loader --validate

_default:
  _reject_event_types:
    - heartbeat
    - health_check
    - health
    - ping
    - pong
    - status_check
    - metric
    - metrics
    - keepalive
    - liveness
    - readiness
  timestamp:
    - timestamp
    - time
    - "@timestamp"
    - ts
  source_ip:
    - source_ip
    - ip
    - client_ip
    - src_ip
    - remote_ip
  username:
    - username
    - user
    - user_id
    - account
    - principal
  event_type:
    - event_type
    - type
    - action
    - event
  result:
    - result
    - outcome
    - status
  reason:
    - reason
    - error
    - message
    - failure_reason
  user_agent:
    - user_agent
    - ua
    - agent
  process_name:
    - process_name
    - process
    - image
    - Image
    - file.name
  command_line:
    - command_line
    - command
    - cmdline
    - process.command_line
    - CommandLine
  location:
    - location
    - geo
    - country
    - client.geographicalContext.country
  source:
    - source
    - provider
    - log_source
    - system
  event_id:
    - event_id
    - id
    - uuid
  scenario_id:
    - scenario_id
  validation_run_id:
    - validation_run_id

